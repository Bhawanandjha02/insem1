
<!DOCTYPE html>
<html>
<head>
    <title>Foodie - Food Delivery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h2>🍔 Foodie</h2>
        <nav>
            <a href="#">Home</a>
            <a href="#menu">Menu</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <section class="hero">
        <h1>Delicious Food Delivered Fast!</h1>
        <p>Fresh, tasty and delivered to your doorstep.</p>
        <a href="#menu" class="btn">Order Now</a>
    </section>

    <section id="menu">
        <h2>Our Popular Food</h2>

        <div class="food-container">

                <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=400" alt="Burger">
                <h3>Cheese Burger</h3>
                <p>₹149</p>
                <button>Order Now</button>
            </div>

            <div class="food">
                <img src="https://images.unsplash.com/photo- pizza" alt="Pizza">
                <h3>Pizza</h3>
                <p>₹249</p>
                <button>Order Now</button>
            </div>

            <div class="food">
                <img src="https://images.unsplash.com/photo-1569718212165-3a8278d5f624?w=400" alt="Noodles">
                <h3>Noodles</h3>
                <p>₹129</p>
                <button>Order Now</button>
            </div>
        </div>
    </section>

    <footer>
        <p>© 2026 Foodie | Made with ❤️ for Food Lovers</p>
    </footer>

</body>
</html>
